[package]
name = "MyNote"
version = "1.0.9999"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mynote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
nucleo-matcher = "0.3"
base64 = "0.22"
chrono = "0.4"
percent-encoding = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
