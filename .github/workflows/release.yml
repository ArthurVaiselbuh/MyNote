name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: MyNote.exe
            out: output/MyNote.exe
          - os: macos-latest
            artifact: mynote-macos
            out: output/mynote-macos
          - os: ubuntu-latest
            artifact: mynote-linux
            out: output/mynote-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend

      - name: cargo test
        working-directory: src/backend
        run: cargo test --locked

      - name: Stamp version (major.minor.commits-since-stamp)
        shell: bash
        run: bash scripts/stamp_version.sh "$(bash scripts/ci_version.sh)"

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/build.ps1
        shell: pwsh

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: bash ./scripts/build.sh

      - name: Run Playwright e2e (Windows only)
        if: runner.os == 'Windows'
        working-directory: src/e2e
        run: |
          npm ci
          npx playwright test

      - name: Upload e2e artifacts on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            src/e2e/test-results
            src/e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload built binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute release version (major.minor.commits-since-stamp)
        id: ver
        run: echo "version=$(bash scripts/ci_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Changelog since last release
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          skip_marked=(--invert-grep --fixed-strings --regexp-ignore-case --grep='[skip-changelog]')
          if [ -n "$prev_tag" ]; then
            git log "${prev_tag}..HEAD" --no-merges "${skip_marked[@]}" --pretty=format:'- %s' > CHANGELOG_body.txt
          else
            git log --no-merges "${skip_marked[@]}" --pretty=format:'- %s' > CHANGELOG_body.txt
          fi

      - name: Publish GitHub release with all platform binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MyNote v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG_body.txt
          files: dist/*
          fail_on_unmatched_files: true
