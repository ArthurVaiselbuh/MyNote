name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci
      - name: svelte-check
        working-directory: src/frontend
        run: npm run check

  backend-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend
      - name: cargo test
        working-directory: src/backend
        run: cargo test --locked

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/backend
      - name: Stamp PR version (base-pr<number>-<run>)
        shell: bash
        run: |
          base=$(jq -r .version src/backend/tauri.conf.json)
          version="${base}-pr${{ github.event.pull_request.number || 0 }}-${{ github.run_number }}"
          echo "Building version $version"
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' src/backend/tauri.conf.json > "$tmp" && mv "$tmp" src/backend/tauri.conf.json
      - name: Build release exe
        run: build.bat
        shell: cmd
      - name: Publish build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyNote.exe
          path: output/MyNote.exe
          if-no-files-found: error
      - name: Install e2e deps
        working-directory: src/e2e
        run: npm ci
      - name: Run Playwright e2e
        working-directory: src/e2e
        run: npx playwright test
      - name: Collect app log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "MyNote/MyNote.log"
          if (Test-Path $log) {
            New-Item -ItemType Directory -Force src/e2e/test-results | Out-Null
            Copy-Item $log src/e2e/test-results/
          }
      - name: Flag flaky tests
        id: flaky
        if: always()
        shell: bash
        working-directory: src/e2e
        run: |
          [ -f test-results/results.json ] || exit 0
          flaky=$(jq -r '[.. | objects | select(has("tests")) | . as $s | $s.tests[]? | select(.status == "flaky") | $s.title] | .[]' test-results/results.json)
          [ -n "$flaky" ] || exit 0
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "## Flaky e2e tests (passed only on retry)" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r t; do
            echo "::warning title=Flaky e2e test::$t passed only on retry"
            echo "- $t" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$flaky"
      - name: Upload e2e artifacts
        if: failure() || steps.flaky.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            src/e2e/test-results
            src/e2e/playwright-report
          if-no-files-found: ignore
